<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Classical Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300;1,400&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  html{ color-scheme:light only; }
  html,body{ background:#fff !important; color:#1a1a1a !important; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  :root{
    --black:#1A1A1A; --accent:#6B8A9A; --accent-light:#F0F5F7;
    --grey-d:#2E2E2E; --grey-m:#4A4A4A; --grey-l:#5F5F5F; --rule:#C9C9C9;
  }
  body{ font-family:'Jost',sans-serif; font-weight:300; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:960px; margin:0 auto; padding:36px 20px; }

  /* Masthead + ticker */
  .masthead{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px;
    border-bottom:1px solid var(--rule); padding-bottom:18px; }
  .m-title{ font-weight:200; font-size:1.5rem; letter-spacing:.06em; text-transform:uppercase; }
  .m-title em{ font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500; text-transform:none; letter-spacing:0; font-size:1.65rem; }
  .ticker{ font-size:.95rem; letter-spacing:.08em; text-transform:uppercase; color:var(--grey-d); font-weight:400; }
  .ticker b{ font-weight:500; color:var(--accent); }

  /* Controls */
  .controls{ margin:22px 0 6px; }
  .row1{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .search{ flex:1 1 260px; position:relative; }
  .search input{ width:100%; font-family:'Jost',sans-serif; font-weight:400; font-size:1.02rem;
    padding:10px 12px 10px 34px; border:1px solid var(--rule); border-radius:3px; background:#fff; color:var(--black); letter-spacing:.02em; }
  .search input:focus{ outline:none; border-color:var(--accent); }
  .search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--grey-l); }
  .toggle{ display:inline-flex; border:1px solid var(--rule); border-radius:3px; overflow:hidden; }
  .toggle button{ font-family:'Jost',sans-serif; font-weight:500; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase;
    padding:11px 20px; background:#fff; color:var(--grey-d); border:none; cursor:pointer; transition:background .15s,color .15s; }
  .toggle button.active{ background:var(--accent); color:#fff; }

  .chips{ display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap; }
  .chips .lab{ font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey-d); margin-right:4px; font-weight:400; }
  .chip{ font-family:'Jost',sans-serif; font-size:.82rem; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 15px; border:1px solid #B5B5B5; border-radius:20px; background:#fff; color:var(--grey-d); cursor:pointer; transition:all .13s; font-weight:400; }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .resultcount{ font-size:.88rem; letter-spacing:.08em; text-transform:uppercase; color:var(--grey-d); margin:18px 0 12px; font-weight:400; }
  .resultcount .chip-name{ color:#4A6A7A; font-weight:500; text-transform:none; letter-spacing:.02em; font-size:1.05rem; }
  .chip-clear{ font-family:'Jost',sans-serif; font-size:.74rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey-m);
    background:none; border:1px solid var(--rule); border-radius:3px; padding:2px 7px; cursor:pointer; margin-left:4px; }
  .chip-clear:hover{ border-color:var(--accent); color:var(--accent); }

  /* ---- LIST (spreadsheet) ---- */
  .grid-head{ display:flex; gap:14px; padding:0 10px 8px; border-bottom:1.5px solid var(--black); }
  .grid-head .col{ font-size:.86rem; letter-spacing:.1em; text-transform:uppercase; color:var(--black); cursor:pointer; user-select:none; font-weight:500; }
  .grid-head .col:hover{ color:var(--accent); }
  .grid-head .col .ar{ opacity:0; margin-left:4px; }
  .grid-head .col.sorted .ar{ opacity:1; }
  .col-c{ flex:0 0 200px; }
  .col-t{ flex:1 1 auto; }
  .col-p{ flex:0 0 210px; }
  .col-a{ flex:0 0 150px; }

  .grow{ display:flex; gap:14px; padding:9px 10px; border-bottom:1px solid #DCDCDC; align-items:baseline; }
  .grow:hover{ background:#FAFBFC; }
  .g-c{ flex:0 0 200px; font-size:1rem; color:var(--black); cursor:pointer; font-weight:400; }
  .g-c:hover{ color:var(--accent); }
  .g-t{ flex:1 1 auto; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.25rem; color:var(--black); cursor:pointer; }
  .g-t:hover{ color:var(--accent); }
  .g-p{ flex:0 0 210px; font-size:.9rem; color:var(--grey-d); }
  .g-a{ flex:0 0 150px; font-size:.9rem; color:var(--grey-d); cursor:pointer; }
  .g-a:hover{ color:var(--accent); }

  .group-head{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.2rem; color:var(--accent);
    padding:18px 10px 6px; border-bottom:1px solid var(--rule); margin-top:6px; }

  /* ---- ALBUMS (shelf) ---- */
  .readout{ position:sticky; top:0; z-index:20; background:#fff; height:42px; display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--rule); }
  .readout .lbl{ font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500; font-size:1.55rem; color:#4A6A7A; }
  .readout .cnt{ font-size:.88rem; letter-spacing:.08em; text-transform:uppercase; color:var(--grey-d); font-weight:400; }
  .readout .idle{ font-size:.88rem; letter-spacing:.08em; text-transform:uppercase; color:var(--grey-d); }
  .readout .named{ display:none; align-items:center; gap:14px; }
  .readout.active .named{ display:flex; }
  .readout.active .idle{ display:none; }
  .shelf{ display:flex; flex-direction:column; border:1px solid var(--rule); border-top:none; border-radius:0 0 3px 3px; background:#fbfbfb; overflow:hidden; }
  .shelf-row{ display:flex; border-bottom:3px solid #E4E4E4; }
  .shelf-row:last-child{ border-bottom:none; }
  .spine{ flex:1 1 auto; height:150px; min-width:9px; max-width:26px; border-right:1px solid rgba(0,0,0,.10);
    display:flex; align-items:flex-start; justify-content:center; padding-top:8px; cursor:pointer; position:relative;
    transition:background .12s; background:#e2e6e8; overflow:hidden; }
  .spine:last-child{ border-right:none; }
  .spine .txt{ writing-mode:vertical-rl; text-orientation:mixed; font-size:.52rem; letter-spacing:.02em; color:rgba(26,26,26,.82);
    font-weight:500; white-space:nowrap; overflow:hidden; max-height:138px; pointer-events:none; user-select:none; line-height:1.05; }
  .spine .txt b{ font-weight:500; }
  .spine .txt .num{ color:rgba(26,26,26,.55); font-size:.5rem; }
  .spine.lit{ background:var(--accent) !important; }
  .spine.lit .txt{ color:#fff; }
  .spine.lit .txt .num{ color:rgba(255,255,255,.72); }
  .legend{ margin-top:14px; font-size:.85rem; color:var(--grey-d); letter-spacing:.03em; }

  /* ---- Shared modal: bin (shelf) and album card (list) ---- */
  .overlay{ position:fixed; inset:0; background:rgba(26,26,26,.44); display:none; align-items:center; justify-content:center; padding:36px 20px; z-index:60; }
  .overlay.open{ display:flex; }
  .bin{ background:#fff; width:100%; max-width:820px; max-height:86vh; border-radius:4px; box-shadow:0 16px 50px rgba(26,26,26,.22);
    display:flex; overflow:hidden; position:relative; }
  .bin.solo{ max-width:600px; }
  .bin-close{ position:absolute; top:12px; right:14px; z-index:3; width:28px; height:28px; border:none; background:none;
    font-size:1.5rem; line-height:1; color:var(--grey-l); cursor:pointer; }
  .bin-close:hover{ color:var(--black); }
  .bin-left{ width:240px; flex-shrink:0; border-right:1px solid var(--rule); background:var(--accent-light); overflow-y:auto; }
  .bin-left.hidden{ display:none; }
  .bl-head{ padding:16px 16px 11px; font-size:.86rem; letter-spacing:.09em; text-transform:uppercase; color:var(--black); font-weight:500;
    border-bottom:1px solid var(--rule); position:sticky; top:0; background:var(--accent-light); }
  .bl-item{ padding:11px 16px; border-bottom:1px solid #CFDCE2; cursor:pointer; transition:background .12s, padding-left .12s; }
  .bl-item:hover{ background:#E4EDF1; padding-left:20px; }
  .bl-item.active{ background:#fff; border-left:3px solid var(--accent); padding-left:13px; }
  .bl-item .bi-alb{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.15rem; color:var(--black); display:block; line-height:1.25; }
  .bl-item .bi-meta{ font-size:.8rem; letter-spacing:.05em; text-transform:uppercase; color:var(--grey-d); margin-top:4px; }
  .bin-right{ flex:1; padding:28px 30px; overflow-y:auto; }
  .br-album{ font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:500; font-size:2rem; line-height:1.15; padding-right:24px; color:var(--black); }
  .br-sub{ font-size:.95rem; letter-spacing:.07em; text-transform:uppercase; color:var(--black); margin-top:10px; font-weight:500; }
  .br-rule{ height:1px; background:var(--rule); margin:16px 0; }
  .br-track{ padding:9px 0; border-bottom:1px solid #DCDCDC; display:flex; gap:11px; }
  .br-track:last-child{ border-bottom:none; }
  .br-n{ font-size:.92rem; color:var(--grey-d); min-width:22px; padding-top:3px; font-weight:400; }
  .br-line{ font-size:1.15rem; line-height:1.35; }
  .br-comp{ font-weight:400; color:var(--black); }
  .br-ttl{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.28rem; color:var(--black); }
  .br-cred{ font-size:.92rem; color:var(--grey-d); margin-top:4px; }
  .disc{ font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; color:var(--black); margin:16px 0 7px; font-weight:500; }

  .empty{ padding:60px 0; text-align:center; color:var(--grey-d); font-size:1.05rem; }
  .empty b{ color:var(--grey-d); font-weight:400; }
  .sentinel{ height:1px; }

  .mobile-albums{ display:none; }
  @media (max-width:700px){
    .wrap{ padding:18px 14px; }
    .m-title{ font-size:1.15rem; }
    .m-title em{ font-size:1.25rem; }
    .masthead{ padding-bottom:12px; gap:6px; }
    .ticker{ font-size:.78rem; letter-spacing:.04em; white-space:nowrap; }

    .controls{ margin:14px 0 4px; }
    .row1{ gap:8px; flex-wrap:nowrap; }
    .search{ flex:1 1 auto; min-width:0; }
    .search input{ font-size:.95rem; padding:9px 10px 9px 30px; }
    .search svg{ left:9px; width:14px; height:14px; }
    .toggle{ flex:0 0 auto; }
    .toggle button{ padding:9px 12px; font-size:.76rem; letter-spacing:.06em; }

    .chips{ display:none; margin-top:8px; gap:6px; flex-wrap:nowrap;
      overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
    .chips.show{ display:flex; }
    .chips::-webkit-scrollbar{ display:none; }
    .chips .lab{ display:none; }
    .chip{ flex:0 0 auto; font-size:.74rem; padding:6px 12px; letter-spacing:.05em; }

    .resultcount{ font-size:.78rem; margin:12px 0 8px; letter-spacing:.05em; }

    .col-p,.g-p,.col-a,.g-a{ display:none; }
    .col-c,.g-c{ flex-basis:118px; }
    .grid-head{ padding:0 4px 7px; gap:10px; }
    .grid-head .col{ font-size:.76rem; letter-spacing:.06em; }
    .grow{ padding:11px 4px; gap:10px; }
    .g-c{ font-size:.92rem; }
    .g-t{ font-size:1.12rem; }

    .overlay{ padding:0; align-items:stretch; }
    .bin, .bin.solo{ flex-direction:column; max-width:100%; max-height:100%; border-radius:0; }
    .bin-left{ width:100%; max-height:150px; border-right:none; border-bottom:1px solid var(--rule); }
    .bin-right{ padding:22px 18px 40px; }
    .br-album{ font-size:1.5rem; padding-right:34px; }
    .br-sub{ font-size:.85rem; letter-spacing:.05em; }
    .br-line{ font-size:1.05rem; }
    .br-ttl{ font-size:1.15rem; }
    .br-cred{ font-size:.86rem; }
    .bin-close{ top:10px; right:12px; width:34px; height:34px; font-size:1.7rem; }

    .shelf, .readout, .legend{ display:none; }
    .mobile-albums{ display:block; }
    .ma-item{ padding:13px 4px; border-bottom:1px solid #DCDCDC; cursor:pointer; }
    .ma-alb{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.18rem; color:var(--black); display:block; line-height:1.25; }
    .ma-meta{ font-size:.8rem; letter-spacing:.04em; text-transform:uppercase; color:var(--grey-d); margin-top:4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="m-title">Living Classical <em>Library</em></div>
    <div class="ticker"><b id="tkComposers">—</b> composers · <b id="tkEntries">—</b> entries · <b id="tkAlbums">—</b> albums</div>
  </div>

  <div class="controls">
    <div class="row1">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="Search the library…" autocomplete="off">
      </div>
      <div class="toggle">
        <button id="tList" class="active">List</button>
        <button id="tAlbums">Albums</button>
      </div>
    </div>
    <div class="chips" id="chips">
      <span class="lab">Search in</span>
      <button class="chip on" data-scope="composer">Composer</button>
      <button class="chip" data-scope="work">Work</button>
      <button class="chip" data-scope="performer">Performer</button>
      <button class="chip" data-scope="album">Album</button>
    </div>
  </div>

  <div class="resultcount" id="rc"></div>
  <div id="view"><div class="empty">Loading the library…</div></div>
  <div class="sentinel" id="sentinel"></div>
</div>

<div class="overlay" id="overlay">
  <div class="bin" id="bin">
    <button class="bin-close" id="binClose" aria-label="Close">×</button>
    <div class="bin-left" id="binLeft"></div>
    <div class="bin-right" id="binRight"></div>
  </div>
</div>


<script>
const SHEET_ID="1tAIAi6DCWFmNDnOoZlakb6ulI8S9yT1DX9qu7wjJAGQ";
const SHEET_NAME="MASTER";
const GVIZ="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(SHEET_NAME);
function cell(c){ return c && c.v!=null ? c.v : ""; }
function stripPron(s){ return String(s).replace(/\s*\([^)]*\)/g,"").trim(); }
function parseYear(c){
  if(!c) return "";
  const raw=c.f!=null?c.f:c.v; if(raw==null) return "";
  const m=String(raw).match(/Date\((\d+),/); if(m) return m[1];
  const y=String(raw).match(/\b(19|20)\d{2}\b/); return y?y[0]:String(raw);
}
async function loadData(){
  const res=await fetch(GVIZ); const txt=await res.text();
  const json=JSON.parse(txt.replace(/^[^{]*\(/,"").replace(/\);?\s*$/,""));
  const rows=json.table.rows||[]; const entries=[];
  rows.forEach(r=>{
    const c=r.c||[];
    const nid=parseInt(cell(c[0]))||0;
    const comp=String(cell(c[1])).trim();
    const title=String(cell(c[2])).trim();
    if(!comp||!title||!(nid>0)) return;
    entries.push({ nid, c:comp, t:title,
      tracks:String(cell(c[3])).trim(), cd:String(cell(c[4])).trim(),
      label:String(cell(c[5])).trim(), spine:String(cell(c[6])).trim(),
      rid:String(cell(c[7])).trim(), s:stripPron(cell(c[8])),
      k:String(cell(c[9])).trim(), e:String(cell(c[10])).trim(),
      album:String(cell(c[11])).trim(), year:parseYear(c[12]) });
  });
  return entries;
}
function buildAlbums(entries){
  const by={}; entries.forEach(e=>{ (by[e.rid]=by[e.rid]||[]).push(e); });
  function ts(t){ const m=String(t||"").match(/\d+/); return m?parseInt(m[0]):999; }
  const albums=Object.keys(by).map(rid=>{
    const rows=by[rid].slice().sort((a,b)=>{ const cd=((parseInt(a.cd)||1)-(parseInt(b.cd)||1)); if(cd) return cd; return ts(a.tracks)-ts(b.tracks); });
    const a0=rows[0];
    return { rid, label:a0.label||"Unknown", spine:a0.spine||"", album:(rows.find(r=>r.album)||{}).album||"",
      tracks:rows.map(r=>({t:r.t,c:r.c,s:r.s,k:r.k,e:r.e,cd:r.cd})) };
  });
  albums.sort((A,B)=>{ const lc=(A.label||"").toLowerCase().localeCompare((B.label||"").toLowerCase()); if(lc) return lc;
    return ((parseInt(A.spine)||999999)-(parseInt(B.spine)||999999)); });
  return albums;
}
</script>
<script>
(async function(){
  const $=s=>document.querySelector(s);
  let ENTRIES, ALBUMS;
  try{ ENTRIES=await loadData(); ALBUMS=buildAlbums(ENTRIES); }
  catch(err){ document.querySelector('#view').innerHTML='<div class="empty"><b>The library could not load.</b><br>Please refresh in a moment.</div>'; console.error(err); return; }
  if(!ENTRIES.length){ document.querySelector('#view').innerHTML='<div class="empty"><b>No entries found.</b></div>'; return; }
  function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // album lookup by rid
  const albumByRid={}; ALBUMS.forEach(a=>albumByRid[a.rid]=a);

  // ticker
  $('#tkComposers').textContent=new Set(ENTRIES.map(e=>e.c)).size.toLocaleString();
  $('#tkEntries').textContent=ENTRIES.length.toLocaleString();
  $('#tkAlbums').textContent=ALBUMS.length.toLocaleString();

  // ---- state ----
  let mode='list', query='', scopes=new Set(['composer']), composerSel='';
  let sortKey='nid', sortDir=-1, shown=0;
  const PAGE=80;

  // ---- search matching (word-boundary) ----
  function wbMatch(hay, q){
    if(!q) return true;
    hay=(hay||'').toLowerCase();
    // match if any word in hay starts with q, or hay starts with q
    return hay.split(/[\s,;:\/\-–—()]+/).some(w=>w.startsWith(q)) || hay.startsWith(q);
  }
  function fieldsForScopes(e){
    const f=[];
    if(scopes.has('composer')) f.push(e.c);
    if(scopes.has('work')) f.push(e.t);
    if(scopes.has('performer')) f.push(e.s, e.k, e.e);
    if(scopes.has('album')) f.push(e.album);
    return f.filter(Boolean);
  }
  function matchEntry(e){
    if(composerSel && e.c!==composerSel) return false;
    if(!query) return true;
    return fieldsForScopes(e).some(v=>wbMatch(v, query));
  }

  // ---- LIST view ----
  const cmp={
    nid:(a,b)=>a.nid-b.nid,
    c:(a,b)=>(a.c||'').localeCompare(b.c||''),
    t:(a,b)=>(a.t||'').localeCompare(b.t||''),
    album:(a,b)=>(a.album||'').localeCompare(b.album||''),
  };
  function sortedEntries(){
    const arr=ENTRIES.filter(matchEntry);
    const f=cmp[sortKey]||cmp.nid;
    arr.sort((a,b)=>f(a,b)*sortDir);
    return arr;
  }

  function renderList(reset){
    const view=$('#view');
    const rows=sortedEntries();
    if(reset){
      shown=0;
      view.innerHTML=
        '<div class="grid-head">'+
        '<div class="col col-c" data-sort="c">Composer<span class="ar"></span></div>'+
        '<div class="col col-t" data-sort="t">Title<span class="ar"></span></div>'+
        '<div class="col col-p">Performers</div>'+
        '<div class="col col-a" data-sort="album">Album<span class="ar"></span></div>'+
        '</div><div id="rows"></div>';
      markSortedCol();
    }
    if(rows.length===0){ view.innerHTML='<div class="empty"><b>No entries found.</b><br>Try different terms or scopes.</div>'; setRC(rows.length,'entry','entries'); return; }
    const box=$('#rows');
    const slice=rows.slice(shown, shown+PAGE);
    const frag=document.createElement('div');
    slice.forEach(e=>{
      const perf=[e.s,e.e,e.k].filter(Boolean).join(' · ');
      const div=document.createElement('div');
      div.className='grow';
      div.innerHTML=
        '<div class="g-c" data-comp="'+esc(e.c)+'">'+esc(e.c)+'</div>'+
        '<div class="g-t" data-rid="'+esc(e.rid)+'">'+esc(e.t)+'</div>'+
        '<div class="g-p">'+esc(perf)+'</div>'+
        '<div class="g-a" data-rid="'+esc(e.rid)+'">'+esc(e.album||'')+'</div>';
      frag.appendChild(div);
    });
    box.appendChild(frag);
    shown+=slice.length;
    setRC(rows.length,'entry','entries');
  }
  function markSortedCol(){
    document.querySelectorAll('.grid-head .col').forEach(c=>{
      c.classList.toggle('sorted', c.dataset.sort===sortKey);
      const ar=c.querySelector('.ar'); if(ar) ar.textContent = c.dataset.sort===sortKey ? (sortDir<0?'↓':'↑') : '';
    });
  }

  // ---- ALBUMS (shelf) view ----
  const blockOf={}; ALBUMS.forEach((a,i)=>{ (blockOf[a.label]=blockOf[a.label]||[]).push(i); });
  let spines=[];
  function renderShelf(){
    const view=$('#view');
    // shelf shows all albums (filtered if query active on album/composer/performer)
    view.innerHTML=
      '<div class="readout" id="readout"><span class="idle">Hover the shelf to find a label</span>'+
      '<span class="named"><span class="lbl" id="roLabel"></span><span class="cnt" id="roCount"></span></span></div>'+
      '<div class="shelf" id="shelf"></div>'+
      '<div class="legend">'+ALBUMS.length.toLocaleString()+' albums · shelved by label, then catalogue number.</div>';
    const shelf=$('#shelf');
    const PER_ROW=58; let html='';
    for(let i=0;i<ALBUMS.length;i+=PER_ROW){
      html+='<div class="shelf-row">';
      for(let j=i;j<Math.min(i+PER_ROW,ALBUMS.length);j++){
        const a=ALBUMS[j];
        html+='<div class="spine" data-i="'+j+'" data-label="'+encodeURIComponent(a.label)+'">'+
          '<span class="txt"><b>'+esc(a.label)+'</b>'+(a.spine?'  <span class="num">'+esc(a.spine)+'</span>':'')+'</span></div>';
      }
      html+='</div>';
    }
    shelf.innerHTML=html;
    spines=[...shelf.querySelectorAll('.spine')];
    const readout=$('#readout');
    shelf.addEventListener('mouseover',e=>{
      const sp=e.target.closest('.spine'); if(!sp) return;
      const label=decodeURIComponent(sp.dataset.label);
      spines.forEach(s=>s.classList.remove('lit'));
      blockOf[label].forEach(idx=>spines[idx].classList.add('lit'));
      readout.classList.add('active');
      $('#roLabel').textContent=label;
      const n=blockOf[label].length; $('#roCount').textContent=n+(n===1?' album':' albums');
    });
    shelf.addEventListener('click',e=>{
      const sp=e.target.closest('.spine'); if(!sp) return;
      openBin(decodeURIComponent(sp.dataset.label), parseInt(sp.dataset.i));
    });

    const ma=document.createElement('div'); ma.className='mobile-albums';
    ma.innerHTML=ALBUMS.map(a=>{
      const comps=[...new Set(a.tracks.map(t=>t.c))];
      const who=comps.length===1?comps[0]:comps.length+' composers';
      return '<div class="ma-item" data-rid="'+encodeURIComponent(a.rid)+'">'+
        '<span class="ma-alb">'+esc(albumName(a))+'</span>'+
        '<span class="ma-meta">'+esc([a.label,a.spine].filter(Boolean).join(' '))+' · '+esc(who)+'</span></div>';
    }).join('');
    ma.addEventListener('click',ev=>{ const it=ev.target.closest('.ma-item'); if(it) openAlbumSolo(decodeURIComponent(it.dataset.rid)); });
    view.appendChild(ma);
    setRC(ALBUMS.length,'album','albums');
  }

  // ---- album card (shared) ----
  function albumName(a){ return a.album || [a.label,a.spine].filter(Boolean).join(' '); }
  function renderAlbumCard(a){
    let h='<div class="br-album">'+esc(albumName(a))+'</div>';
    h+='<div class="br-sub">'+esc([a.label,a.spine].filter(Boolean).join(' '))+' · '+a.tracks.length+(a.tracks.length===1?' entry':' entries')+'</div>';
    h+='<div class="br-rule"></div>';
    const discs=[...new Set(a.tracks.map(t=>t.cd||'1'))]; const multi=discs.length>1; let n=0;
    discs.forEach(d=>{
      if(multi) h+='<div class="disc">Disc '+esc(d)+'</div>';
      a.tracks.filter(t=>(t.cd||'1')===d).forEach(t=>{
        n++;
        const cred=[t.s,t.e,t.k].filter(Boolean).join(' · ');
        h+='<div class="br-track"><div class="br-n">'+n+'</div><div>'+
          '<div class="br-line"><span class="br-comp">'+esc(t.c)+'</span> — <span class="br-ttl">'+esc(t.t)+'</span></div>'+
          (cred?'<div class="br-cred">'+esc(cred)+'</div>':'')+
          '</div></div>';
      });
    });
    return h;
  }
  // from shelf: two-pane bin (label list + album)
  function openBin(label, focusIdx){
    const bin=$('#bin'); bin.classList.remove('solo');
    $('#binLeft').classList.remove('hidden');
    const items=blockOf[label].map(i=>ALBUMS[i]);
    $('#binLeft').innerHTML='<div class="bl-head">'+esc(label)+' · '+items.length+(items.length===1?' album':' albums')+'</div>'+
      items.map(a=>{
        const comps=[...new Set(a.tracks.map(t=>t.c))];
        const meta=[a.spine, comps.length===1?comps[0]:comps.length+' composers'].filter(Boolean).join(' · ');
        return '<div class="bl-item" data-rid="'+encodeURIComponent(a.rid)+'"><span class="bi-alb">'+esc(albumName(a))+'</span><span class="bi-meta">'+esc(meta)+'</span></div>';
      }).join('');
    const focus=ALBUMS[focusIdx] && ALBUMS[focusIdx].label===label ? ALBUMS[focusIdx] : items[0];
    selectInBin(focus.rid);
    openOverlay();
  }
  function selectInBin(rid){
    document.querySelectorAll('.bl-item').forEach(el=>el.classList.toggle('active', decodeURIComponent(el.dataset.rid)===rid));
    $('#binRight').innerHTML=renderAlbumCard(albumByRid[rid]);
    $('#binRight').scrollTop=0;
  }
  // from list: solo album card (no left pane)
  function openAlbumSolo(rid){
    const a=albumByRid[rid]; if(!a) return;
    const bin=$('#bin'); bin.classList.add('solo');
    $('#binLeft').classList.add('hidden');
    $('#binRight').innerHTML=renderAlbumCard(a);
    $('#binRight').scrollTop=0;
    openOverlay();
  }
  function openOverlay(){ $('#overlay').classList.add('open'); document.body.style.overflow='hidden'; }
  function closeOverlay(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; }

  // ---- composer pivot ----
  function showComposer(name){
    mode='list'; syncToggle();
    query=''; $('#q').value=''; composerSel=name;
    render(true); window.scrollTo({top:0,behavior:'smooth'});
  }
  function clearComposer(){ composerSel=''; render(true); }

  // ---- result count ----
  function setRC(n,sing,plur){
    const rc=$('#rc');
    if(composerSel && mode==='list'){
      rc.innerHTML='All works by <span class="chip-name">'+esc(composerSel)+'</span>'+
        '<button class="chip-clear" id="clearComp">clear ×</button> · '+n.toLocaleString()+' '+(n===1?sing:plur);
      const cc=$('#clearComp'); if(cc) cc.onclick=clearComposer;
    } else {
      rc.textContent=n.toLocaleString()+' '+(n===1?sing:plur)+((query||composerSel)?' matching':'');
    }
  }

  function render(reset){ mode==='list'?renderList(reset):renderShelf(); }
  function syncToggle(){ $('#tList').classList.toggle('active',mode==='list'); $('#tAlbums').classList.toggle('active',mode==='albums'); }

  // ---- events ----
  $('#tList').onclick=()=>{ if(mode==='list')return; mode='list'; syncToggle(); render(true); window.scrollTo({top:0}); };
  $('#tAlbums').onclick=()=>{ if(mode==='albums')return; mode='albums'; composerSel=''; syncToggle(); render(true); window.scrollTo({top:0}); };

  let qt;
  $('#q').oninput=e=>{ clearTimeout(qt); const v=e.target.value.trim();
    $('#chips').classList.toggle('show', v.length>0);
    qt=setTimeout(()=>{ query=v.toLowerCase(); render(true); },150); };

  $('#chips').addEventListener('click',e=>{
    const ch=e.target.closest('.chip'); if(!ch) return;
    const sc=ch.dataset.scope;
    if(scopes.has(sc)){ if(scopes.size>1){ scopes.delete(sc); ch.classList.remove('on'); } }
    else { scopes.add(sc); ch.classList.add('on'); }
    if(query) render(true);
  });

  $('#view').addEventListener('click',e=>{
    const h=e.target.closest('.grid-head .col'); if(h && h.dataset.sort){
      const k=h.dataset.sort;
      if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=(k==='nid'?-1:1); }
      render(true); return;
    }
    const comp=e.target.dataset.comp; if(comp){ showComposer(comp); return; }
    const rid=e.target.dataset.rid; if(rid){ openAlbumSolo(rid); return; }
  });

  $('#binLeft').addEventListener('click',e=>{ const it=e.target.closest('.bl-item'); if(it) selectInBin(decodeURIComponent(it.dataset.rid)); });
  $('#binClose').addEventListener('click',closeOverlay);
  $('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeOverlay(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOverlay(); });

  // infinite scroll (list only)
  new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting && mode==='list') renderList(false); }); },{rootMargin:'500px'}).observe($('#sentinel'));

  syncToggle();
  render(true);
})();
</script>
</body>
</html>
